name: Release

on:
  push:
    branches: [main]
    paths:
      - plugin.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-native:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: navidrome-login-darwin-arm64
            src: navidrome-login
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: navidrome-login-darwin-amd64
            src: navidrome-login
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: navidrome-login-windows-amd64.exe
            src: navidrome-login.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: navidrome-login-windows-arm64.exe
            src: navidrome-login.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --manifest-path native/navidrome-login/Cargo.toml --target ${{ matrix.target }}
      - name: Rename binary in target
        shell: bash
        run: cp native/navidrome-login/target/${{ matrix.target }}/release/${{ matrix.src }} native/navidrome-login/target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: native/navidrome-login/target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
      - uses: actions/download-artifact@v4
        with:
          pattern: navidrome-login-*
          merge-multiple: true
          path: bin/
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: git diff --exit-code
      - name: Verify four release archives
        run: |
          for target in darwin-arm64 darwin-amd64 windows-arm64 windows-amd64; do
            if [[ ! -f "dist/release/plugin-$target.zip" ]]; then
              echo "Missing dist/release/plugin-$target.zip" >&2
              exit 1
            fi
            if [[ ! -f "dist/release/plugin-$target.zip.sha256" ]]; then
              echo "Missing dist/release/plugin-$target.zip.sha256" >&2
              exit 1
            fi
          done
      - name: Read release version
        id: version
        run: jq -r '"tag=v" + .version' plugin.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/release/
      - name: Verify existing tag
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          existing="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$RELEASE_COMMIT" ]]; then
            echo "Existing tag points to a different commit" >&2
            exit 1
          fi
      - name: Verify archives
        working-directory: dist/release
        run: sha256sum --check ./*.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/*.zip dist/release/*.sha256 \
            --generate-notes --target "$RELEASE_COMMIT"
