<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Signed in</title>
    <style>
      :root {
        --bg: #f6f6f7;
        --surface: #ffffff;
        --line: #e2e2e7;
        --text: #17171b;
        --muted: #6d6d78;
        --accent: #4f46e5;
        --ok: #1f8a5b;
        --ok-soft: #e6f4ed;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131316;
          --surface: #1b1b20;
          --line: #2e2e36;
          --text: #ececf1;
          --muted: #9a9aa7;
          --accent: #8b83ff;
          --ok: #6cd7a6;
          --ok-soft: #1c2b24;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans SC",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: min(360px, 100%);
        padding: 32px 24px 26px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 18px 48px rgb(0 0 0 / 0.12);
      }

      .tick {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: var(--ok-soft);
        color: var(--ok);
      }

      .tick svg {
        width: 26px;
        height: 26px;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
      }

      .server {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12.5px;
        overflow-wrap: anywhere;
      }

      .hint {
        margin: 20px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="tick" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 13l4 4L19 7" />
        </svg>
      </span>
      <h1 id="title">Signed in</h1>
      <p class="server">{{server}}</p>
      <p class="hint" id="hint">Returning to MyGo Music&hellip;</p>
    </main>

    <script>
      const zh = (navigator.language || "").toLowerCase().startsWith("zh");
      if (zh) {
        document.documentElement.lang = "zh-CN";
        document.getElementById("title").textContent = "已登录";
        document.getElementById("hint").textContent = "正在返回 MyGo Music\u2026";
      }

      // The tab was opened by another app, so most browsers refuse to close it.
      // The card stays as the way out when they do.
      setTimeout(() => {
        window.close();
        document.getElementById("hint").textContent = zh ? "可以关闭此页面了。" : "You can close this page now.";
      }, 1000);
    </script>
  </body>
</html>
