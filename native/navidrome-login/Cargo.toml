[package]
name = "navidrome-login"
version = "0.1.0"
edition = "2021"
description = "Local sign-in page for a Navidrome plugin host"
publish = false

[dependencies]
getrandom = "0.3"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# rustls only: no gzip, no charset decoding, no cookie store, no proxy.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
# The helper ships inside every plugin archive, so it is built for size.
# Measured on aarch64-apple-darwin: opt-level "z" 1.40 MB, "s" 1.55 MB, "3" 1.88 MB.
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
